name: Build and Release Ink Arena Remastered

'on':
  push:
    branches:
      - main
      - 'feature/**'
      - 'security/**'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run build && npx electron-builder --win nsis --publish never

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v1.3.3]'))
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.3' }}
          name: Ink Arena Remastered ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.3' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

# v1.3.3 adds a timeout to stalled GitHub Releases update checks.
